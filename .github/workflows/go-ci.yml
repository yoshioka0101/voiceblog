name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test:
    # testcontainers-go が Docker daemon に接続して PostgreSQL を起動する。
    # job.container や services.postgres は使わず、runner 上の Docker を前提にする。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Docker for testcontainers
        run: docker info

      - name: Go mod tidy
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...
