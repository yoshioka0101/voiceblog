name: backend-ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    # testcontainers-go が Docker daemon に接続して PostgreSQL を起動する。
    # job.container や services.postgres は使わず、runner 上の Docker を前提にする。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Docker for testcontainers
        run: docker info

      - name: Go mod tidy
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Run golangci-lint
        # go.mod の tool ディレクティブでバージョンを固定し、ローカルの make lint と揃える
        run: go tool golangci-lint run ./...

      - name: Check go fix
        # go fix -diff は差分があっても exit 0 なので、出力が空でなければ失敗させる
        run: |
          diff_output=$(go fix -diff ./...)
          if [ -n "$diff_output" ]; then
            echo "$diff_output"
            echo "::error::go fix の未適用差分があります。ローカルで 'go fix ./...' を実行してください。"
            exit 1
          fi
