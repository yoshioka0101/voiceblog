openapi: 3.0.3
info:
  title: Voiceblog API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health'
components:
  schemas:
    HealthResponse:
      $ref: '#/components/schemas/health'
    health:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
