openapi: 3.0.3
info:
  title: Voiceblog API
  version: 0.1.0
paths:
  /health:
    $ref: ./paths/health.yaml
  /me:
    $ref: ./paths/me.yaml
  /prompts:
    $ref: ./paths/prompts.yaml
  /prompts/{id}:
    $ref: ./paths/prompt_by_id.yaml
  /articles:
    $ref: ./paths/articles.yaml
  /articles/generate:
    $ref: ./paths/article_generate.yaml
  /articles/{id}:
    $ref: ./paths/article_by_id.yaml
  /transcriptions:
    $ref: ./paths/transcriptions.yaml
components:
  schemas:
    ArticleResponse:
      $ref: ./components/schemas/article.yaml
    ArticlesResponse:
      $ref: ./components/schemas/article_list_response.yaml
    CreateArticleRequest:
      $ref: ./components/schemas/article_create_request.yaml
    GeneratedArticleResponse:
      $ref: ./components/schemas/generated_article.yaml
    GenerateArticleRequest:
      $ref: ./components/schemas/article_generate_request.yaml
    UpdateArticleRequest:
      $ref: ./components/schemas/article_update_request.yaml
    HealthResponse:
      $ref: ./components/schemas/health.yaml
    PromptResponse:
      $ref: ./components/schemas/prompt.yaml
    PromptsResponse:
      $ref: ./components/schemas/prompt_list_response.yaml
    CreatePromptRequest:
      $ref: ./components/schemas/prompt_create_request.yaml
    UpdatePromptRequest:
      $ref: ./components/schemas/prompt_update_request.yaml
    TranscriptionResponse:
      $ref: ./components/schemas/transcription.yaml
    CreateTranscriptionRequest:
      $ref: ./components/schemas/transcription_create_request.yaml
    UserResponse:
      $ref: ./components/schemas/user.yaml
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        次のどちらかを Bearer トークンとして送る。
        - iOS アプリのデバイストークン: `vbd_` + base64url（パディングなし）でエンコードした 32 byte の乱数。
          サーバーは SHA-256 ハッシュを auth_subject として匿名ユーザー（auth_provider = device）を作成・特定する。
        - Google ID トークン（JWT）
