get:
  summary: Get current user's article
  operationId: getArticle
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/article.yaml
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
    "404":
      description: Not Found
patch:
  summary: Update current user's article
  operationId: updateArticle
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/article_update_request.yaml
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/article.yaml
    "400":
      description: Bad Request
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
    "404":
      description: Not Found
delete:
  summary: Soft delete current user's article
  operationId: deleteArticle
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  responses:
    "204":
      description: No Content
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
    "404":
      description: Not Found
