post:
  summary: Generate article synchronously
  operationId: generateArticle
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/article_generate_request.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/article.yaml
    "400":
      description: Bad Request
    "401":
      description: Unauthorized
