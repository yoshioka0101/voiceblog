post:
  summary: Generate article synchronously
  operationId: generateArticle
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/article_generate_request.yaml
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/generated_article.yaml
    "400":
      description: Bad Request
    "401":
      description: Unauthorized
    "429":
      description: |
        1 日あたりの生成上限に達した（ユーザー単位 GENERATE_DAILY_LIMIT_PER_USER、全体 GENERATE_DAILY_LIMIT_GLOBAL。UTC の日付で区切る）。
        レスポンスの code は rate_limited。
