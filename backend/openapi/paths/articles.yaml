get:
  summary: List current user's articles
  operationId: listArticles
  security:
    - bearerAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/article.yaml
    "401":
      description: Unauthorized
post:
  summary: Create article manually
  operationId: createArticle
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/article_create_request.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/article.yaml
    "400":
      description: Bad Request
    "401":
      description: Unauthorized
