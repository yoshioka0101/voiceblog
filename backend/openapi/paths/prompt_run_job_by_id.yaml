get:
  summary: Get current user's prompt run job
  operationId: getPromptRunJob
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/prompt_run_job.yaml
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
    "404":
      description: Not Found
