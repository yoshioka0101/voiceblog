get:
  summary: Get transcription detail
  operationId: getTranscription
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/transcription.yaml
    "400":
      description: Bad Request
    "401":
      description: Unauthorized
    "403":
      description: Forbidden
    "404":
      description: Not Found
